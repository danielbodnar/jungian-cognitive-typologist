name = "jungian-typologist-api"
main = "worker/index.js"
compatibility_date = "2024-10-01"

# Secrets (must be set via wrangler or GitHub Actions):
# - CLAUDE_API_KEY: Your Claude API key from console.anthropic.com
#   Run: wrangler secret put CLAUDE_API_KEY
#   Or configure in GitHub: Settings -> Secrets and variables -> Actions
#
# Optional environment variables:
# - ALLOWED_ORIGIN: Custom domain to allow CORS requests from (in addition to defaults)
#   Example: https://yourdomain.com

[env.production]
name = "jungian-typologist-api"
